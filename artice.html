<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic Knowledge & Knowledge Hub | DeenPoint</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fa; }
        .topic-sidebar { max-height: calc(100vh - 120px); overflow-y: auto; }
        .topic-btn {
            border: 1px solid #e9ecef;
            background: #ffffff;
            color: #495057;
            transition: all 0.2s ease;
            cursor: pointer;
            text-align: left;
            width: 100%;
        }
        .topic-btn:hover, .topic-btn.active {
            background-color: #198754;
            color: #ffffff !important;
            border-color: #198754;
        }
        .article-view {
            animation: fadeIn 0.3s ease-in-out;
            line-height: 1.8;
            color: #2b2f33;
        }
        .article-view h2 { margin-top: 2rem; margin-bottom: 1rem; font-weight: 700; color: #198754; }
        .article-view h3 { margin-top: 1.5rem; margin-bottom: 0.8rem; font-weight: 600; color: #212529; }
        .article-view p { margin-bottom: 1.25rem; font-size: 1.05rem; }
        .quote-box {
            background-color: #e8f5e9;
            border-left: 5px solid #198754;
            padding: 1.25rem;
            margin: 1.5rem 0;
            border-radius: 0 8px 8px 0;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fa-solid fa-kaaba text-success me-2"></i>DeenPoint Knowledge Base
            </a>
            <span class="badge bg-success-subtle text-success border border-success-subtle">17 Topics Active</span>
        </div>
    </nav>

    <main class="py-4">
        <div class="container">
            <div class="row g-4">

                <!-- Sidebar (17 Topics) -->
                <aside class="col-lg-4 col-md-5">
                    <div class="card border-0 shadow-sm p-3 rounded-4 bg-white sticky-top topic-sidebar" style="top: 80px;">
                        <h5 class="fw-bold text-dark mb-3 px-2">
                            <i class="fa-solid fa-list-check text-success me-2"></i>Topic Registry
                        </h5>
                        
                        <div class="mb-3">
                            <input type="text" id="topicSearch" class="form-control rounded-3" placeholder="Filter topics..." onkeyup="filterTopics()">
                        </div>

                        <div class="d-flex flex-column gap-2" id="topicListContainer"></div>
                    </div>
                </aside>

                <!-- Dynamic Article View -->
                <section class="col-lg-8 col-md-7">
                    <div class="card border-0 shadow-sm p-4 p-md-5 rounded-4 bg-white">
                        <div id="articleHeader" class="border-bottom pb-3 mb-4"></div>
                        <article id="articleBody" class="article-view"></article>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <!-- 1. External Articles Data File Linked Here -->
    <script src="articles-data.js"></script>

    <!-- 2. UI Logic Script -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof articlesDB !== 'undefined' && articlesDB.length > 0) {
                renderSidebar(articlesDB);
                loadArticle(1);
            }
        });

        function renderSidebar(data) {
            const container = document.getElementById("topicListContainer");
            container.innerHTML = "";
            
            data.forEach((item, index) => {
                const btn = document.createElement("button");
                btn.className = `btn topic-btn p-3 rounded-3 ${index === 0 ? 'active' : ''}`;
                btn.setAttribute("onclick", `selectTopic(${item.id}, this)`);
                btn.innerHTML = `<i class="fa-solid fa-book-bookmark text-success me-2"></i> ${item.title}`;
                container.appendChild(btn);
            });
        }

        function selectTopic(id, btnElement) {
            document.querySelectorAll(".topic-btn").forEach(b => b.classList.remove("active"));
            btnElement.classList.add("active");
            loadArticle(id);
        }

        function loadArticle(id) {
            const article = articlesDB.find(a => a.id === id);
            if (!article) return;

            document.getElementById("articleHeader").innerHTML = `
                <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
                    <span class="badge bg-success-subtle text-success border border-success-subtle">${article.category}</span>
                    <span class="badge bg-light text-dark border"><i class="fa-regular fa-clock me-1"></i>${article.readTime}</span>
                    <span class="badge bg-light text-dark border"><i class="fa-solid fa-file-lines me-1"></i>${article.wordCount}</span>
                </div>
                <h1 class="fw-bold text-dark display-6 mb-0">${article.title}</h1>
            `;

            document.getElementById("articleBody").innerHTML = article.content;
            
            if (window.innerWidth < 768) {
                document.getElementById("articleHeader").scrollIntoView({ behavior: 'smooth' });
            }
        }

        function filterTopics() {
            const query = document.getElementById("topicSearch").value.toLowerCase();
            const filtered = articlesDB.filter(a => a.title.toLowerCase().includes(query));
            renderSidebar(filtered);
        }
    </script>
    <script src="article-date.js"></script>
</body>
</html>
